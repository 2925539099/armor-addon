org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# ---- NeoForge / Minecraft ----
minecraft_version=1.21.1
neo_version=21.1.244

# ---- 模组信息 ----
mod_version=1.2.4
maven_group=com.armoraddon
# 产物文件名（archivesName）不在这里设置：它需要中文，而本文件按 ISO-8859-1
# 解析会导致乱码，因此写在 build.gradle 的 base { archivesName = ... } 里。

# ---- 下载源镜像 ----
# BMCLAPI：Mojang 资源（client/server jar、官方库、资源文件）的镜像
bmclapi_base=https://bmclapi2.bangbang93.com
# NeoForge 官方仓库的 ForgeCDN 镜像
neoforged_mirror=https://neoforged.forgecdn.net
# 本地重写代理使用的固定端口（NFRT 会缓存改写过 URL 的版本 JSON，端口必须稳定）
mirror_port=47821
